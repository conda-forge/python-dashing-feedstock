{% set name = "dashing" %}
{% set version = "0.2.0" %}

package:
  # There is a non-Python dashing package on bioconda.
  name: python-{{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/dashing-{{ version }}.tar.gz
  sha256: aeb56020ea2ae170a09498ff23f9c30cc76c02b83de3467e1262112578abbd9b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - blessed

test:
  imports:
    - dashing
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/FedericoCeratto/dashing
  summary: High-level terminal-based dashboard
  license: LGPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - xhochy
